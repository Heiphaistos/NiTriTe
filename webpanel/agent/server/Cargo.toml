[package]
name = "nitrite-agent"
version = "1.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Agent NiTriTe sans interface : sert le panneau web et execute les commandes"

[[bin]]
name = "nitrite-agent"
path = "src/main.rs"

[dependencies]
nitrite = { path = "../core" }
tauri = { path = "../crates/tauri" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["set-header", "compression-gzip", "compression-br"] }
rust-embed = { version = "8", features = ["mime-guess", "debug-embed"] }
rand = "0.9"
open = "5"
dirs = "6"
rfd = { version = "0.15", default-features = false }
sha2 = "0.11"
base64 = "0.22"
reqwest = { version = "0.13", features = ["json"] }
semver = "1"
chrono = "0.4"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
