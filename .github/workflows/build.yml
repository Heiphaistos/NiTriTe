name: Build & Release Nitrite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions minimales (principe de moindre privilège)
permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Audit npm — bloque si vulnérabilité critique détectée
      - run: npm audit --audit-level=critical
      # vue-tsc et non tsc : `tsc` ignore les SFC (shim `*.vue` = export par
      # defaut seulement), donc tout type declare dans un `<script setup>`
      # passait sous le radar de la CI.
      - run: npx vue-tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Audit npm — bloque si vulnérabilité critique détectée
      - run: npm audit --audit-level=critical
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        # NOTE: actions/checkout@v4, actions/setup-node@v4, dtolnay/rust-toolchain@stable
        # utilisent des tags flottants. Pour un build reproductible, les fixer sur des SHA complets.
        # Ex: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Cargo audit (vulnérabilités Rust)
        working-directory: src-tauri
        run: cargo install cargo-audit --quiet && cargo audit
      - run: npm run test -- --run
