# Verification de build, a la demande.
#
# Cette CI NE PUBLIE PLUS. Depuis la 8.217.0, la publication se fait depuis la
# machine de Momo (`python outils/publier.py`), pour deux raisons :
#
#   - les deux fichiers destines aux clients pesent ~350 Mo chacun : ils
#     embarquent logiciel\, Drivers\ et Script Windows\, qui ne sont pas dans le
#     depot ;
#   - les charges de mise a jour ne vont pas sur GitHub mais sur
#     nitrite.heiphaistos.org/maj/, ou aucun client n'a a aller les chercher.
#
# Le declenchement par tag a ete retire : il aurait publie, a chaque `git tag`,
# une release faite des mauvais fichiers.

name: Verification de build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Keep the artifacts for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nitrite-${{ steps.version.outputs.VERSION }}
          retention-days: 7
          path: |
            src-tauri/target/release/nitrite.exe
            src-tauri/target/release/bundle/nsis/Nitrite_${{ steps.version.outputs.VERSION }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Nitrite_${{ steps.version.outputs.VERSION }}_x64-setup.exe.sig
