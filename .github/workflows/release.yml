name: Release Nitrite

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (ex: v6.86.0)"
        required: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive `
            -Path "src-tauri/target/release/nitrite.exe" `
            -DestinationPath "Nitrite_${v}_portable.zip"

      - name: Build updater manifest (latest.json)
        shell: pwsh
        run: |
          $v   = "${{ steps.version.outputs.VERSION }}"
          $exe = "Nitrite_${v}_x64-setup.exe"
          $sig = Get-Content "src-tauri/target/release/bundle/nsis/$exe.sig" -Raw
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          @{
            version   = $v
            notes     = "Nitrite v$v"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig.Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$exe"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: "Nitrite v${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Nitrite_${{ steps.version.outputs.VERSION }}_portable.zip
            src-tauri/target/release/bundle/nsis/Nitrite_${{ steps.version.outputs.VERSION }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Nitrite_${{ steps.version.outputs.VERSION }}_x64-setup.exe.sig
            latest.json
